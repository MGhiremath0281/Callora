name: CI

on:
  push:
    branches:
      - main
      - module-2-crm-sync
      - v2-module-2-crm-sync
      - feature/module-1-lead-import
      - feature/recovery-agent-notebook
      - "feature/**"
      - ci-cd-setup
  pull_request:
    branches:
      - main
      - module-2-crm-sync
      - v2-module-2-crm-sync
      - feature/module-1-lead-import
      - feature/recovery-agent-notebook
      - "feature/**"

# Cancel superseded runs for the same ref instead of stacking them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default: CI never needs write access to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest

    # Isolated PostgreSQL instance for the migration check. Credentials are
    # throwaway values that only exist inside this ephemeral job container —
    # no repository, production, or developer database is ever contacted.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: callora
          POSTGRES_PASSWORD: callora
          POSTGRES_DB: callora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callora -d callora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Points the app/migrations at the throwaway service above. The test
      # suite itself creates its own per-test SQLite databases (see
      # backend/tests/conftest.py), so tests never touch this database.
      CALLORA_DATABASE_URL: postgresql+psycopg2://callora:callora@localhost:5432/callora_test
      CALLORA_API_KEYS: "ci_biz:ci-key"  # dummy value, not a secret

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "ruff==0.17.1"

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run test suite
        # Tests use isolated SQLite databases per test; no external CRM is
        # contacted (HTTP calls are mocked in the suite).
        run: python -m pytest -q

      - name: Apply Alembic migrations to PostgreSQL
        # Verifies the migration chain applies cleanly on the real target
        # database engine (PostgreSQL), which SQLite tests cannot cover.
        run: alembic upgrade head

      - name: Build backend Docker image
        working-directory: .
        run: docker build -t callora-backend:ci ./backend
