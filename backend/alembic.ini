# Alembic configuration for the Callora backend.
# The database URL is read from application settings (CALLORA_DATABASE_URL)
# inside alembic/env.py so there is a single source of truth.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally unset; env.py resolves it from Settings.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
