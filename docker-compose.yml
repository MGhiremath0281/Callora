services:
  db:
    image: postgres:16-alpine
    container_name: callora-db
    environment:
      POSTGRES_USER: callora
      POSTGRES_PASSWORD: callora
      POSTGRES_DB: callora
    ports:
      - "5433:5432"
    volumes:
      - callora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callora -d callora"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis is an accelerator for the outbound voice module (rate limiting,
  # caching, temporary call state). It is never the source of truth: the
  # backend keeps working — slower — when Redis is down.
  redis:
    image: redis:7-alpine
    container_name: callora-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - callora_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callora-backend
    ports:
      - "8001:8000"
    environment:
      CALLORA_DATABASE_URL: postgresql+psycopg2://callora:callora@db:5432/callora
      CALLORA_API_KEYS: "biz_001:dev-key-biz-001"
      CALLORA_CRM_BASE_URL: http://host.docker.internal:9000
      # Dev-only: permits the exact host:port above (fake CRM on the host).
      # Remove in production; all other private destinations stay blocked.
      CALLORA_CRM_DEV_ALLOWED_DESTINATIONS: host.docker.internal:9000
      CALLORA_CRM_TIMEOUT_SECONDS: 15
      CALLORA_CRM_BUSINESS_NAME: UrbanNest Realty
      CALLORA_LOG_LEVEL: INFO
      # Optional LLM key for the recovery strategist; unset = rules-fallback.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # --- Outbound voice agent ---
      CALLORA_REDIS_URL: redis://redis:6379/0
      CALLORA_REDIS_ENABLED: "true"
      CALLORA_BOLNA_API_KEY: ${CALLORA_BOLNA_API_KEY:-}
      CALLORA_BOLNA_DEFAULT_AGENT_ID: ${CALLORA_BOLNA_DEFAULT_AGENT_ID:-}
      CALLORA_BOLNA_DEFAULT_FROM_NUMBER: ${CALLORA_BOLNA_DEFAULT_FROM_NUMBER:-}
      # Master switch for real outbound calling. Keep it false until the
      # compliance policy and the provider account are ready.
      CALLORA_VOICE_ENABLE_OUTBOUND_CALLS: ${CALLORA_VOICE_ENABLE_OUTBOUND_CALLS:-false}
      CALLORA_VOICE_LLM_PROVIDER: ${CALLORA_VOICE_LLM_PROVIDER:-groq}
      # Deployment environment marker. "production" (the default) keeps every
      # compliance rule enforced; set "local" in your .env to unlock the
      # development-only override below.
      CALLORA_ENVIRONMENT: ${CALLORA_ENVIRONMENT:-production}
      # Development-only: skips the daily per-lead and per-business call
      # quotas. Ignored (and logged) unless CALLORA_ENVIRONMENT names a
      # development environment.
      CALLORA_DISABLE_CALL_QUOTAS: ${CALLORA_DISABLE_CALL_QUOTAS:-false}
      # Minimum gap between two calls to the same lead, in seconds. The
      # default (3600 = 60 minutes) is the production value; a local .env
      # may lower it for fast test calls. It never weakens the in-flight
      # guard (a call Bolna still reports as queued/ringing/active).
      CALLORA_VOICE_DUPLICATE_CALL_COOLDOWN_SECONDS: ${CALLORA_VOICE_DUPLICATE_CALL_COOLDOWN_SECONDS:-3600}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The background worker that drains the durable voice job queue
  # (post-call analysis, retries, dead-letter handling).
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callora-worker
    environment:
      CALLORA_DATABASE_URL: postgresql+psycopg2://callora:callora@db:5432/callora
      CALLORA_API_KEYS: "biz_001:dev-key-biz-001"
      CALLORA_LOG_LEVEL: INFO
      CALLORA_REDIS_URL: redis://redis:6379/0
      CALLORA_REDIS_ENABLED: "true"
      CALLORA_BOLNA_API_KEY: ${CALLORA_BOLNA_API_KEY:-}
      CALLORA_BOLNA_DEFAULT_AGENT_ID: ${CALLORA_BOLNA_DEFAULT_AGENT_ID:-}
      CALLORA_BOLNA_DEFAULT_FROM_NUMBER: ${CALLORA_BOLNA_DEFAULT_FROM_NUMBER:-}
      CALLORA_VOICE_ENABLE_OUTBOUND_CALLS: ${CALLORA_VOICE_ENABLE_OUTBOUND_CALLS:-false}
      CALLORA_VOICE_LLM_PROVIDER: ${CALLORA_VOICE_LLM_PROVIDER:-groq}
      # Same environment marker and development-only override as the backend
      # service: the worker reads the same configuration.
      CALLORA_ENVIRONMENT: ${CALLORA_ENVIRONMENT:-production}
      CALLORA_DISABLE_CALL_QUOTAS: ${CALLORA_DISABLE_CALL_QUOTAS:-false}
      # The worker reads the same configuration as the backend.
      CALLORA_VOICE_DUPLICATE_CALL_COOLDOWN_SECONDS: ${CALLORA_VOICE_DUPLICATE_CALL_COOLDOWN_SECONDS:-3600}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - ./backend/app:/app/app
    command: ["python", "-m", "app.modules.voice.jobs.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: callora-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  callora_pgdata:
  callora_redisdata:
