services:
  db:
    image: postgres:16-alpine
    container_name: callora-db
    environment:
      POSTGRES_USER: callora
      POSTGRES_PASSWORD: callora
      POSTGRES_DB: callora
    ports:
      - "5433:5432"
    volumes:
      - callora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callora -d callora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callora-backend
    ports:
      - "8001:8000"
    environment:
      CALLORA_DATABASE_URL: postgresql+psycopg2://callora:callora@db:5432/callora
      CALLORA_API_KEYS: "biz_001:dev-key-biz-001"
      CALLORA_CRM_BASE_URL: http://host.docker.internal:9000
      # Dev-only: permits the exact host:port above (fake CRM on the host).
      # Remove in production; all other private destinations stay blocked.
      CALLORA_CRM_DEV_ALLOWED_DESTINATIONS: host.docker.internal:9000
      CALLORA_CRM_TIMEOUT_SECONDS: 15
      CALLORA_CRM_BUSINESS_NAME: UrbanNest Realty
      CALLORA_LOG_LEVEL: INFO
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

volumes:
  callora_pgdata: